{% extends 'base.html' %}

{% block title %}400 — Bad Request | ShareMeal{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1rem; text-align: center; max-width: 600px;">
  <div style="font-size: 3.5rem; font-weight: 800; color: var(--color-warning); line-height: 1; margin-bottom: 1rem;">400</div>
  <h2>Invalid or Incomplete Request</h2>
  <p class="lead">
    {{ error_message or "The server could not understand your request due to missing or invalid submission data." }}
  </p>
  <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return Home</a>
    <button onclick="window.history.back()" class="btn btn-secondary">Go Back</button>
  </div>
</div>
{% endblock %}
