{% extends 'base.html' %}

{% block title %}404 — Page Not Found | ShareMeal{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1rem; text-align: center; max-width: 600px;">
  <div style="font-size: 3.5rem; font-weight: 800; color: var(--color-primary); line-height: 1; margin-bottom: 1rem;">404</div>
  <h2>Resource Not Found</h2>
  <p class="lead">
    The page or donation listing you are looking for does not exist, has expired, or has been removed from distribution.
  </p>
  <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return Home</a>
    <button onclick="window.history.back()" class="btn btn-secondary">Go Back</button>
  </div>
</div>
{% endblock %}
