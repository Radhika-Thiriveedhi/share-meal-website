{% extends 'base.html' %}

{% block title %}Sign In — ShareMeal Platform{% endblock %}

{% block content %}
<div class="container" style="padding: var(--space-2xl) var(--space-md); max-width: 500px;">
  <div class="card">
    <div class="card-header" style="text-align: center; display: block;">
      <h2 style="font-size: 1.4rem; margin-bottom: 0.25rem;">Sign In to ShareMeal</h2>
      <p style="font-size: 0.85rem; color: var(--color-text-muted); margin: 0;">Access your surplus food redistribution dashboard</p>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@organization.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
            <label class="form-label" for="password" style="margin: 0;">Password <span class="required">*</span></label>
          </div>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Sign In &rarr;</button>
      </form>

      <hr style="margin: 1.5rem 0;">

      <!-- 1-Click Role Testing Switcher -->
      <div style="background-color: var(--color-bg-subtle); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 0.5rem; letter-spacing: 0.04em;">
          Quick Demo Credentials (1-Click Fill)
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('admin@sharemeal.org', 'Admin@123')">
            Administrator
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('greenbites@restaurant.com', 'Donor@123')">
            Donor (Bistro)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('hopehaven@shelter.org', 'Org@123')">
            NGO (Shelter)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('alex.v@volunteer.org', 'Vol@123')">
            Volunteer
          </button>
        </div>
      </div>
    </div>

    <div class="card-footer" style="justify-content: center; font-size: 0.88rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="margin-left: 4px; font-weight: 600;">Register here</a>
    </div>
  </div>
</div>

<script>
function fillLogin(email, pwd) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
