<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <title>{% block title %}ShareMeal — Surplus Food Redistribution{% endblock %}</title>

  <!-- Modular CSS Design System (Zero Blue Tokens) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  {% include 'components/_navbar.html' %}

  <!-- Flash Messages & System Alerts -->
  <div class="container" style="margin-top: 1rem;">
    {% include 'components/_alerts.html' %}
  </div>

  <!-- Page Body -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% block footer %}
    {% include 'components/_footer.html' %}
  {% endblock %}

  <!-- Core Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/form_validation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
